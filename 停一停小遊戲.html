<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小遊戲選擇</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(16px, 5vw, 56px);
      color: #142c40;
      background: #edf5fa;
      font-family: "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
    }
    main { width: min(100%, 48rem); }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 46px); line-height: 1.35; }
    nav { display: grid; gap: 16px; }
    a {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 104px;
      padding: 18px 20px;
      border: 2px solid #376a96;
      border-radius: 18px;
      color: inherit;
      background: #fff;
      text-decoration: none;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 750;
    }
    a + a { border-color: #36724d; }
    a:hover { background: #e1f0fc; }
    a + a:hover { background: #e1f4e8; }
    a:focus-visible { outline: 4px solid #142c40; outline-offset: 4px; }
    .icon { flex: none; font-size: 42px; }
    @media (min-width: 680px) {
      nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main>
    <h1>選擇小遊戲</h1>
    <nav aria-label="選擇遊戲">
      <a href="./stop-game.html"><span class="icon" aria-hidden="true">🛑</span>停一停、諗一諗</a>
      <a href="./wait-game.html"><span class="icon" aria-hidden="true">🚦</span>等一等小遊戲</a>
    </nav>
  </main>
</body>
</html>
